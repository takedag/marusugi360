@media(max-width:700px){.hotspotEditor{left:7px;top:72px;width:250px}.editorLaunch{left:7px;top:72px}}

</style>

</section>
<div id="crosshair" class="crosshair on"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<script>
const publicMode=document.body.dataset.publicMode==="true";
if(publicMode) document.body.classList.add("publicMode");
const scenes=JSON.parse(document.getElementById("sceneData").textContent);
const initialScenes=JSON.parse(JSON.stringify(scenes));
let currentScene="entrance";
function spotId(sceneId,index){return `spot-${sceneId}-${index}`}
function moveSpot(div,args){div.classList.add("custom-hotspot");div.dataset.label=args.label||"移動"}
function makeSpot(sceneId,index,link){return {id:spotId(sceneId,index),pitch:link.pitch,yaw:link.yaw,type:"scene",sceneId:link.target,cssClass:"custom-hotspot",createTooltipFunc:moveSpot,createTooltipArgs:{label:link.label},text:link.label}}
const pannellumScenes={};
Object.entries(scenes).forEach(([id,s])=>{pannellumScenes[id]={title:s.title,type:"equirectangular",panorama:s.image,pitch:-3,yaw:s.yaw,hfov:120,minHfov:50,maxHfov:120,hotSpots:s.links.map((l,i)=>makeSpot(id,i,l))}});
const viewer=pannellum.viewer("panorama",{default:{firstScene:"entrance",autoLoad:true,autoRotate:-6,autoRotateInactivityDelay:2500,sceneFadeDuration:850,showControls:true,showFullscreenCtrl:false,compass:false,mouseZoom:true,draggable:true},scenes:pannellumScenes});
document.getElementById("panorama").addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation()},{capture:true});
const thumbs=document.getElementById("thumbs");
Object.entries(scenes).forEach(([id,s],i)=>{const b=document.createElement("button");b.className="thumb";b.dataset.scene=id;b.innerHTML=`<img src="${s.image}" alt="${s.title}"><span>${String(i+1).padStart(2,"0")} ${s.title}</span>`;b.onclick=()=>viewer.loadScene(id);thumbs.appendChild(b)});
let mapEditMode=false;
function sync(id){currentScene=id;document.getElementById("sceneName").textContent=scenes[id].title;document.querySelectorAll("[data-scene]").forEach(el=>el.classList.toggle("active",el.dataset.scene===id));const active=document.querySelector(`.thumb[data-scene="${id}"]`);if(active)active.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});if(!publicMode) syncEditorToScene(id)}
viewer.on("scenechange",sync);
document.querySelectorAll(".roomBtn").forEach(b=>b.addEventListener("click",e=>{if(mapEditMode){e.preventDefault();return}viewer.loadScene(b.dataset.scene)}));
